<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crowd Runner: playable blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="vendor/three.min.js"></script>
<style>
:root{
  --ink:#1b2230; --ink-2:#2c3548; --paper:#eef3f6; --muted:#a3afc0;
  --blue:#3d7bf0; --blue-deep:#2455b3; --teal:#16a99b; --gold:#f2b929; --red:#e0483f;
  --sky:#a9cfe0; --panel:#1b2230; --panel-edge:#2f3a50; --key:#c9d4e0;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky:#5e8196; --panel:#121823; --panel-edge:#26303f; }
}
:root[data-theme="dark"]{ --sky:#5e8196; --panel:#121823; --panel-edge:#26303f; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--paper);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
*,*::before,*::after{box-sizing:inherit}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

#hud{position:fixed;inset:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px);}
#hud[hidden]{display:none}
#top{display:flex;align-items:flex-start;gap:12px}
#lvl{flex:1;max-width:520px}
#lvlName{font-family:var(--display);font-size:18px;line-height:1.1;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.4)}
#section{font-size:15px;font-weight:600;color:var(--ink-2);margin-top:2px}
#prog{position:relative;height:10px;margin-top:8px;background:rgba(27,34,48,.28);border-radius:6px;overflow:visible}
#progFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);border-radius:6px}
.mark{position:absolute;top:-3px;width:3px;height:16px;background:var(--paper);border-radius:2px;transform:translateX(-1px)}
.mark.cp{background:var(--teal)}
.mark.done{opacity:.5}
#pauseBtn{pointer-events:auto;width:46px;height:46px;border-radius:12px;border:0;background:var(--panel);color:var(--paper);
  font-family:var(--display);font-size:16px;box-shadow:0 4px 0 #0c1018;cursor:pointer}
#tiers{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-width:520px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:10px;padding:4px 10px 4px 8px;font-size:15px;font-weight:600}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip b{font-family:var(--display);font-weight:400;font-size:15px;min-width:1.5em;text-align:right}
.chip span{color:var(--muted)}
#target{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 118px);transform:translateX(-50%);width:min(420px,70vw);text-align:center}
#target[hidden]{display:none}
#targetName{font-family:var(--display);font-size:16px;color:var(--ink);margin-bottom:4px}
.bar{height:14px;background:var(--panel);border-radius:8px;padding:3px}
#targetFill{height:100%;width:100%;background:var(--red);border-radius:5px;transition:width .12s linear}
#badge{position:absolute;left:0;top:0;font-family:var(--display);font-size:26px;line-height:1;color:#fff;background:var(--blue);
  padding:6px 14px 5px;border-radius:999px;box-shadow:0 4px 0 var(--blue-deep);white-space:nowrap;will-change:transform}
#badge.low{background:var(--red);box-shadow:0 4px 0 #9d2a24}
#banner{position:absolute;left:0;right:0;top:25%;text-align:center;font-family:var(--display);font-size:clamp(28px,6vw,56px);
  color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;opacity:0;transition:opacity .25s}
#banner.show{opacity:1}
#banner small{display:block;font-family:var(--ui);font-weight:700;font-size:clamp(15px,2.4vw,20px);-webkit-text-stroke:0;color:var(--ink);margin-top:6px}
.pop{position:absolute;left:0;top:0;font-family:var(--display);font-size:24px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;white-space:nowrap;will-change:transform,opacity}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:10px;font-size:15px;font-weight:600;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center}
#hint.show{opacity:.95}
#touch{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:space-between;padding:0 18px}
#touch[hidden]{display:none}
#touch button{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:0;font-family:var(--display);font-size:15px;color:#fff;background:rgba(27,34,48,.78);box-shadow:0 5px 0 rgba(10,14,22,.8);touch-action:none}
#touch button.on{background:var(--blue)}

#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(20,28,40,.35);overflow-y:auto}
#screen[hidden]{display:none}
.panel{background:var(--panel);border:2px solid var(--panel-edge);border-radius:20px;padding:26px 26px 22px;width:min(520px,100%);max-height:100%;overflow-y:auto;box-shadow:0 10px 0 rgba(10,14,22,.55)}
.panel.menu{width:min(560px,100%)}
.title{font-family:var(--display);font-weight:400;font-size:clamp(46px,11vw,78px);line-height:.88;margin:0 0 12px;color:#fff;letter-spacing:-.01em}
.title .row2{display:block;color:var(--gold)}
h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;margin:0 0 10px}
p{font-size:18px;line-height:1.4;margin:0 0 14px;color:#d5dde6;max-width:60ch}
.sub{font-size:19px;color:#cbd5e0}
.levels{display:grid;gap:8px;margin:18px 0 14px}
.lvlbtn{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:14px;padding:10px 14px;
  background:var(--ink-2);color:var(--paper);font-family:var(--ui);font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #0c1018}
.lvlbtn .num{font-family:var(--display);font-size:24px;color:var(--gold);text-align:center}
.lvlbtn .meta{display:block;font-size:15px;font-weight:500;color:var(--muted)}
.lvlbtn .stars{font-size:20px;letter-spacing:2px;color:var(--gold)}
.lvlbtn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-family:var(--ui);font-size:18px;font-weight:700;cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--key)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn:active,.lvlbtn:active,#touch button:active,#pauseBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1018}
.btn:focus-visible,.lvlbtn:focus-visible,#pauseBtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:18px;margin:4px 0 16px}
.stats dt{color:var(--muted)} .stats dd{margin:0;font-family:var(--display);text-align:right}
.bigstars{font-size:44px;color:var(--gold);letter-spacing:6px;margin:0 0 8px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:17px;margin:0 0 16px}
.keys kbd{font-family:var(--ui);font-weight:700;background:var(--ink-2);border-radius:6px;padding:1px 8px;white-space:nowrap}
.board{list-style:none;padding:0;margin:0 0 16px;counter-reset:r}
.board li{display:grid;grid-template-columns:2em 1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--panel-edge);font-size:18px}
.board li::before{counter-increment:r;content:counter(r);font-family:var(--display);color:var(--gold)}
.board li b{font-family:var(--display);font-weight:400}
.board li.me{color:var(--gold)}
.note{font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ #banner,#hint,#targetFill{transition:none} }
@media (max-width:560px){ #lvlName{font-size:15px} .chip{font-size:13px;padding:3px 8px} .chip b{font-size:13px} #badge{font-size:21px} }
</style>
</head>
<body>
<canvas id="c" aria-label="Game view"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div id="lvl">
      <div id="lvlName"></div>
      <div id="section"></div>
      <div id="prog"><div id="progFill"></div><div id="progMarks"></div></div>
      <div id="tiers">
        <div class="chip"><i style="background:var(--blue)"></i><span>Infantry</span><b id="n0">0</b></div>
        <div class="chip"><i style="background:var(--teal)"></i><span>Gunners</span><b id="n1">0</b></div>
        <div class="chip"><i style="background:var(--gold)"></i><span>Titans</span><b id="n2">0</b></div>
        <div class="chip"><span>HP pool</span><b id="hp">0</b></div>
      </div>
    </div>
    <button id="pauseBtn" aria-label="Pause">II</button>
  </div>
  <div id="target" hidden><div id="targetName"></div><div class="bar"><div id="targetFill"></div></div></div>
  <div id="badge">0</div>
  <div id="banner"></div>
  <div id="popups"></div>
  <div id="hint"></div>
  <div id="touch" hidden><button id="sprintBtn" aria-label="Sprint">Sprint</button><button id="jumpBtn" aria-label="Jump">Jump</button></div>
</div>

<div id="screen"><div class="panel menu" id="panel"><p>Loading the track...</p></div></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const DARK = matchMedia('(prefers-color-scheme: dark)').matches;
const store = {
  get(k,d){ try{ const v=localStorage.getItem('ucr:'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('ucr:'+k, JSON.stringify(v)); }catch(e){} }
};
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=Math.random;

if(!window.THREE){ $('#panel').innerHTML='<h2>Could not load the 3D engine</h2><p>The three.js script did not load. Check the connection and reload the page.</p>'; return; }

/* =========================================================
   TUNING. Every balance number lives here so it can move
   straight into a ScriptableObject / DataAsset when porting.
   ========================================================= */
const CFG = {
  half: 6, arenaHalf: 12,
  baseSpeed: 9, minSpeed: 5.5, maxSpeed: 14.5,
  steer: 12,
  jumpV: 9.5, gravity: 24,
  packC: 0.36,                 // crowd packing density
  tierHP:   [1, 5, 25],        // HP per unit of each tier
  tierArea: [1, 2.2, 4.6],     // footprint used for crowd packing
  mergeN: 5,                   // 5 of a tier merge into 1 of the next
  cap: [420, 140, 60],         // max rendered instances per tier (the count itself is not capped)
  melee:  [2, 8, 30],           // damage per unit per second when touching a wall, gate or boss
  ranged: [0, 4, 14],          // ranged damage per unit per second (tier 0 has no gun)
  splash: 3.2,                 // titan splash radius
  volley: 0.3, range: 44,
  grace: 0.14,                 // seconds a unit can hang over the void before it falls
  crumbleDelay: 2.0,
  maxUnits: 6000,
  wallBite: 3,                 // HP lost per second while pushing a spiked wall
};
const COL = { tier:[0x3d7bf0,0x16a99b,0xf2b929], enemy:0xc73a33, pos:0x3d7bf0, neg:0xe0483f };
const TIER_NAME = ['Infantry','Gunner','Titan'];

/* ================= renderer / scene ================= */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:!IS_TOUCH, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, IS_TOUCH?1.5:2));
const scene=new THREE.Scene();
const SKY=new THREE.Color(DARK?0x5e8196:0xa9cfe0);
scene.background=SKY; scene.fog=new THREE.Fog(SKY, 75, 175);
const camera=new THREE.PerspectiveCamera(55,1,.1,500);
scene.add(new THREE.HemisphereLight(0xf1f7ff, 0x6b5a45, DARK?0.62:0.7));
const sun=new THREE.DirectionalLight(0xfff6e8, DARK?0.5:0.6); sun.position.set(-20,40,-12); scene.add(sun);
const voidMesh=new THREE.Mesh(new THREE.PlaneGeometry(900,900), new THREE.MeshBasicMaterial({color:DARK?0x3e5a6c:0x7fa6bd}));
voidMesh.rotation.x=-Math.PI/2; voidMesh.position.y=-38; scene.add(voidMesh);
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<h?72:55; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ================= geometry + materials ================= */
const SHARED=new Set();
function share(g){ SHARED.add(g); return g; }
function part(g,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const m=new THREE.Matrix4().compose(new THREE.Vector3(x,y,z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)), new THREE.Vector3(1,1,1)); return [g,m]; }
function merge(parts){
  const pos=[], nor=[];
  for(const [g,m] of parts){ const gg=(g.index?g.toNonIndexed():g.clone()); gg.applyMatrix4(m);
    const p=gg.attributes.position.array, n=gg.attributes.normal.array; for(let i=0;i<p.length;i++){ pos.push(p[i]); nor.push(n[i]); } }
  const out=new THREE.BufferGeometry(); out.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); out.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3)); return share(out);
}
const Box=(a,b,c)=>new THREE.BoxGeometry(a,b,c), Cyl=(a,b,h,s=10)=>new THREE.CylinderGeometry(a,b,h,s), Sph=(r,s=10)=>new THREE.SphereGeometry(r,s,Math.max(6,s-2));
const GEO={
  u0: merge([part(Cyl(.17,.22,.5,8),0,.45,0), part(Sph(.17,8),0,.86,0), part(Box(.09,.09,.34),.19,.52,.15), part(Box(.12,.3,.14),-.09,.12,0), part(Box(.12,.3,.14),.09,.12,0)]),
  u1: merge([part(Box(.54,.56,.4),0,.64,0), part(Sph(.21,10),0,1.12,0), part(Box(.15,.15,.74),.32,.74,.3), part(Box(.2,.36,.22),-.14,.18,0), part(Box(.2,.36,.22),.14,.18,0), part(Box(.62,.12,.44),0,.95,0)]),
  u2: merge([part(Cyl(.46,.56,.95,12),0,1.0,0), part(Sph(.3,12),0,1.72,0), part(Sph(.28,10),-.6,1.38,0), part(Sph(.28,10),.6,1.38,0),
             part(Cyl(.15,.15,1.1,10),.66,1.15,.42,Math.PI/2,0,0), part(Box(.3,.6,.32),-.24,.3,0), part(Box(.3,.6,.32),.24,.3,0)]),
  box: share(Box(1,1,1)), sph: share(Sph(1,14)), cyl: share(Cyl(1,1,1,16)), cone: share(new THREE.ConeGeometry(1,1,8)),
  saw: share(Cyl(1.25,1.25,.16,24)), plane: share(new THREE.PlaneGeometry(1,1)),
};
const lam=c=>new THREE.MeshLambertMaterial({color:c}), basic=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}));
const MAT={
  stoneA:lam(0xd2bd8f), stoneB:lam(0xc2aa7a), funnel:lam(0xaebfd4), crumble:lam(0xb08f63), rail:lam(0x6a5540), warn:lam(0xe0483f),
  wall:lam(0x8a7866), spike:lam(0x5d646f), fort:lam(0x9d8f80), fortDark:lam(0x7b6e62), door:lam(0x6b4a2e), metal:lam(0x98a2ae), hub:lam(0xe0483f),
  groove:lam(0x3a3f48), barrel:lam(0xd9433b), band:lam(0xf3f3f3), enemy:lam(COL.enemy), boss:lam(0x5b4d66), bossDark:lam(0x3b3244),
  weak:basic(0xffd23f), eye:basic(0xffe27a), flag:lam(0x16a99b), post:lam(0x33405a), wood:lam(0x7a5a3a),
};
const UPV=new THREE.Vector3(0,1,0), tmpM=new THREE.Matrix4(), tmpC=new THREE.Color(), tmpV=new THREE.Vector3(), tmpQ=new THREE.Quaternion(), tmpS=new THREE.Vector3(), tmpE=new THREE.Euler();
function mesh(geo,mat,x,y,z,sx=1,sy=1,sz=1,parent){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); (parent||T.cur.g).add(m); return m; }

/* instanced crowd, fx and projectile pools */
const UM=[0,1,2].map(t=>{ const m=new THREE.InstancedMesh(GEO['u'+t], lam(COL.tier[t]), CFG.cap[t]+140); m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.frustumCulled=false; m.count=0; scene.add(m); return m; });
function pool(geo, n, mat){ const m=new THREE.InstancedMesh(geo, mat, n); m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.frustumCulled=false; for(let i=0;i<n;i++){ tmpM.makeScale(0,0,0); m.setMatrixAt(i,tmpM); m.setColorAt(i,tmpC.setHex(0xffffff)); } m.instanceColor.setUsage(THREE.DynamicDrawUsage); scene.add(m); return m; }
const FXN=700, fxMesh=pool(share(Box(.2,.2,.2)), FXN, lam(0xffffff)); const fx=[]; for(let i=0;i<FXN;i++) fx.push({life:0,max:1,x:0,y:0,z:0,vx:0,vy:0,vz:0}); let fxHead=0;
const PJN=160, pjMesh=pool(share(Sph(.2,8)), PJN, basic(0xffffff)); const shots=[];
const ENN=60, enMesh=pool(share(Sph(.24,8)), ENN, basic(0xff5a3c)); const arrows=[];

function burst(x,y,z,color,n=6,spd=5,life=.7){
  tmpC.setHex(color);
  for(let k=0;k<n;k++){ const i=fxHead; fxHead=(fxHead+1)%FXN; const p=fx[i];
    p.x=x;p.y=y;p.z=z; p.vx=(rand()-.5)*spd; p.vy=rand()*spd*.8+2; p.vz=(rand()-.5)*spd+ (C.vz*.5); p.life=p.max=life*(.6+rand()*.6); fxMesh.setColorAt(i,tmpC); }
  fxMesh.instanceColor.needsUpdate=true;
}
function updateFx(dt){
  for(let i=0;i<FXN;i++){ const p=fx[i]; if(p.life<=0){ continue; }
    p.life-=dt; p.vy-=22*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; if(p.y<.1&&p.vy<0&&p.y>-1){ p.y=.1; p.vy*=-.3; p.vx*=.6; p.vz*=.6; }
    const s=p.life>0? clamp(p.life/p.max,0,1)*1.1 : 0; tmpM.makeScale(s,s,s); tmpM.setPosition(p.x,p.y,p.z); fxMesh.setMatrixAt(i,tmpM); }
  fxMesh.instanceMatrix.needsUpdate=true;
}

/* ================= track ================= */
const H=CFG.half;
const T={};
function disposeTree(o){ o.traverse(n=>{ if(n.geometry && !SHARED.has(n.geometry)) n.geometry.dispose(); if(n.material && n.material.userData && n.material.userData.own){ if(n.material.map) n.material.map.dispose(); n.material.dispose(); } }); }
function resetTrack(seed){
  if(T.group){ scene.remove(T.group); disposeTree(T.group); }
  Object.assign(T,{ group:new THREE.Group(), segs:[], gates:[], saws:[], pends:[], barrels:[], walls:[], cps:[], sections:[], crumbles:[], chunks:[],
    fort:null, boss:null, Z:0, endZ:0, fids:0, rnd:rng(seed||1), cur:null });
  scene.add(T.group);
}
function chunk(fn){ const g=new THREE.Group(); T.group.add(g); T.cur={g, z0:T.Z}; fn(); T.cur.z1=T.Z; T.chunks.push(T.cur); }
function L(x0,x1,rail=true,x0b=x0,x1b=x1){ return {a0:x0,a1:x1,b0:x0b,b1:x1b,rail}; }
function slab(z0,z1,x0a,x1a,x0b,x1b,mat,th=1.2){
  const g=new THREE.BoxGeometry(1,1,1), p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i)+.5, y=p.getY(i), z=p.getZ(i)+.5; const xl=lerp(x0a,x0b,z), xr=lerp(x1a,x1b,z); p.setXYZ(i, lerp(xl,xr,x), y*th-th/2, z0+(z1-z0)*z); }
  g.computeVertexNormals(); const m=new THREE.Mesh(g,mat); T.cur.g.add(m); return m;
}
function rail(za,xa,zb,xb){ const len=Math.hypot(zb-za,xb-xa); const m=mesh(GEO.box,MAT.rail,(xa+xb)/2,.27,(za+zb)/2,.3,.55,len); m.rotation.y=Math.atan2(xb-xa,zb-za); }
function addSeg(z0,z1,lanes,f={}){
  const s={z0,z1,lanes,funnel:!!f.funnel,fid:f.fid||0,crumble:!!f.crumble,fallAt:0,gone:false,meshes:[],fallV:0};
  T.segs.push(s);
  for(const l of lanes){
    if(f.crumble){ const m=slab(z0,z1-.12,l.a0,l.a1,l.b0,l.b1,MAT.crumble,.7); s.meshes.push(m); }
    else { let z=z0; while(z<z1-1e-6){ const ze=Math.min(z1,(Math.floor(z/8+1e-6)+1)*8); const t0=(z-z0)/(z1-z0), t1=(ze-z0)/(z1-z0);
        const mat=f.funnel?MAT.funnel:(Math.floor(z/8+1e-6)%2?MAT.stoneA:MAT.stoneB);
        slab(z,ze,lerp(l.a0,l.b0,t0),lerp(l.a1,l.b1,t0),lerp(l.a0,l.b0,t1),lerp(l.a1,l.b1,t1),mat); z=ze; } }
    if(l.rail && !f.crumble){ rail(z0,l.a0-.15,z1,l.b0-.15); rail(z0,l.a1+.15,z1,l.b1+.15); }
  }
  if(f.crumble) T.crumbles.push(s);
  return s;
}
function segAt(z){ const a=T.segs; let lo=0,hi=a.length-1; while(lo<=hi){ const m=(lo+hi)>>1; if(a[m].z1<=z) lo=m+1; else if(a[m].z0>z) hi=m-1; else return a[m]; } return null; }
const LR=[0,0];
function laneAt(l,s,z){ const t=clamp((z-s.z0)/(s.z1-s.z0),0,1); LR[0]=l.a0+(l.b0-l.a0)*t; LR[1]=l.a1+(l.b1-l.a1)*t; return LR; }

function labelTex(text){

}
const OPS={'+':'+','-':'\u2212','x':'\u00d7','/':'\u00f7'};

const P={
  run(len){ chunk(()=>{ addSeg(T.Z,T.Z+len,[L(-H,H)]); T.Z+=len; }); },

  wall(hp){ chunk(()=>{ const z0=T.Z; addSeg(z0,z0+30,[L(-H,H)]); addWall(z0+18,-H,H,hp); T.Z+=30; }); },
  funnel(w){ chunk(()=>{ const z0=T.Z;
    const fid=++T.fids; addSeg(z0,z0+14,[L(-H,H,true,-w/2,w/2)],{funnel:true,fid}); addSeg(z0+14,z0+34,[L(-w/2,w/2)],{funnel:true,fid}); addSeg(z0+34,z0+46,[L(-w/2,w/2,true,-H,H)]);

  jump(gap){ chunk(()=>{ const z0=T.Z; addSeg(z0,z0+12,[L(-H,H)]); for(let i=0;i<6;i++) mesh(GEO.box,i%2?MAT.warn:MAT.post,-H+1+i*2,.02,z0+11.4,2,.05,1.1);
    addSeg(z0+12,z0+12+gap,[]); addSeg(z0+12+gap,z0+24+gap,[L(-H,H)]); T.Z+=24+gap; }); },
  crumble(len,w,x=0){ chunk(()=>{ const z0=T.Z; addSeg(z0,z0+6,[L(-H,H)]); let z=z0+6; const end=z0+6+len;
    while(z<end){ const ze=Math.min(end,z+2.4); addSeg(z,ze,[L(x-w/2,x+w/2,false)],{crumble:true}); z=ze; }
    addSeg(end,end+8,[L(-H,H)]); T.Z=end+8; }); },
  // risky lane on the left: narrow, no rails, big multipliers. safe lane on the right: railed, small adds.
  branch(risk,safe,len=64,riskSaw=true){ chunk(()=>{ const z0=T.Z; addSeg(z0,z0+8,[L(-H,H)]);
    const R0=2.2, S1=-1.0; addSeg(z0+8,z0+8+len,[L(R0,H,false),L(-H,S1,true)]);

    for(const sx of [-1,1]){ mesh(GEO.cyl,MAT.fortDark,sx*(A+.6),3.6,wz,1.6,7.2,1.6,wg); mesh(GEO.cone,MAT.hub,sx*(A+.6),8.1,wz,1.9,1.8,1.9,wg); }

    const arms=[]; for(const sx of [-1,1]){ const a=new THREE.Group(); a.position.set(sx*3.3,8,0); body.add(a); mesh(GEO.box,MAT.boss,0,-2.4,0,1.4,4.8,1.4,a); mesh(GEO.box,MAT.bossDark,0,-5.1,0,1.9,1.5,1.9,a); arms.push(a); }
    const weak=[]; const wp=[[0,6.6,-1.7],[-3.3,8.4,-.85],[3.3,8.4,-.85]];

    T.boss={kind:'boss',x:0,y:6,z:bz,hp,max:hp,alive:true,weak,g,body,arms,head,atk:null,cd:3,lv,flash:0,dead:0,name:'The Warden'};
    T.Z=z0+61; T.endZ=T.Z; }); },

/* ================= crowd ================= */
const C={ x:0,z:0,vz:0,speed:9,n:[0,0,0],units:[[],[],[]],fallers:[[],[],[]],jumpT:null,jumpFront:0,jumpVz:9,air:2*CFG.jumpV/CFG.gravity,
  front:0,back:0,radius:1,compress:1,engaged:null,hpDebt:0,mergeT:0,volleyT:0,funnelSeg:-1,funnelTier:-1,popMode:'hit',spawnOX:0,spawnOZ:0,prevZ:0,maxY:0,mergePop:0,steerVis:0 };
function newUnit(ox,oz){ return {ox,oz,sx:0,sz:0,y:0,off:0,dead:false,ph:rand()*6.28,yaw:(rand()-.5)*.25,wx:0,wz:0}; }
const total=()=>C.n[0]+C.n[1]+C.n[2];
const hpPool=()=>C.n[0]+C.n[1]*CFG.tierHP[1]+C.n[2]*CFG.tierHP[2];
function resetCrowd(n,z){ C.n=n.slice(); C.units=[[],[],[]]; C.fallers=[[],[],[]]; C.x=0; C.z=z; C.prevZ=z; C.vz=0; C.jumpT=null; C.engaged=null; C.hpDebt=0; C.speed=CFG.baseSpeed; sync('none'); for(const a of C.units) for(const u of a){ u.ox=(rand()-.5)*2; u.oz=(rand()-.5)*2; } }
function sync(mode){
  for(let t=0;t<3;t++){ const arr=C.units[t], target=Math.min(C.n[t],CFG.cap[t]);
    while(arr.length>target){ const u=arr.pop(); if(mode==='merge'){ if(rand()<.35) burst(C.x+u.ox,.8,C.z+u.oz,0xffe066,2,3,.5); } else if(mode!=='none') burst(C.x+u.ox,.6+u.y,C.z+u.oz,COL.tier[t],3,4); }
    while(arr.length<target){ arr.push(newUnit(C.spawnOX+(rand()-.5)*1.4, C.spawnOZ+(rand()-.5)*1.4)); } }
}
function removeHP(a){ a=Math.round(a); let guard=0;
  while(a>0 && total()>0 && guard++<100000){ if(C.n[0]>0){ const k=Math.min(C.n[0],a); C.n[0]-=k; a-=k; } else if(C.n[1]>0){ C.n[1]--; C.n[0]+=CFG.mergeN; } else if(C.n[2]>0){ C.n[2]--; C.n[1]+=CFG.mergeN; } } }
function capUnits(){ const tt=total(); if(tt>CFG.maxUnits){ const f=CFG.maxUnits/tt; for(let t=0;t<3;t++) C.n[t]=Math.floor(C.n[t]*f); } }
const KQ=[[],[],[]];
function queueKill(t,i,mode){ const u=C.units[t][i]; if(!u||u.dead) return; u.dead=true; KQ[t].push({i,mode}); }
function processKills(){
  for(let t=2;t>=0;t--){ const q=KQ[t]; if(!q.length) continue; q.sort((a,b)=>b.i-a.i);
    for(const k of q) killUnit(t,k.i,k.mode); q.length=0; }
}
function killUnit(t,i,mode){
  const arr=C.units[t], u=arr[i]; if(!u) return;
  const n=C.n[t]; if(n<=0){ return; }
  const w=Math.min(n,Math.max(1,Math.round(n/Math.max(1,arr.length))));
  C.n[t]-=w; if(mode==='hit'&&t>0) C.n[t-1]+=3*w;
  const wx=C.x+u.ox, wz=C.z+u.oz;
  if(mode==='fall'){ const f=C.fallers[t]; if(f.length<100) f.push({x:wx,y:u.y,z:wz,vy:0,r:0,life:1.4}); }
  else burst(wx,.6+u.y,wz,COL.tier[t],t===0?5:10,5);
  if(Math.min(C.n[t],CFG.cap[t])<arr.length){ arr[i]=arr[arr.length-1]; arr.pop();
    if(mode==='hit'&&t>0){ const a2=C.units[t-1]; for(let j=0;j<3&&a2.length<Math.min(C.n[t-1],CFG.cap[t-1]);j++) a2.push(newUnit(u.ox+(rand()-.5)*.7,u.oz+(rand()-.5)*.7)); } }
  else { u.dead=false; u.off=0; if(mode==='fall'){ u.ox=u.sx; u.oz=u.sz; } }
}
const GOLDEN=Math.PI*(3-Math.sqrt(5));
function computeSlots(){ let k=0,cum=0;
  for(let t=2;t>=0;t--){ const arr=C.units[t], a=CFG.tierArea[t];
    for(let i=0;i<arr.length;i++){ const r=CFG.packC*Math.sqrt(cum+a*.5), th=k*GOLDEN; arr[i].sx=Math.cos(th)*r; arr[i].sz=Math.sin(th)*r; cum+=a; k++; } }
  return CFG.packC*Math.sqrt(cum)+.35;
}
function unitY(u){ if(C.jumpT===null) return 0; const tau=C.jumpT-(C.jumpFront-u.oz)/C.jumpVz; if(tau<=0||tau>=C.air) return 0; return CFG.jumpV*tau-.5*CFG.gravity*tau*tau; }
function tryJump(){ if(state!=='play'||C.jumpT!==null) return; C.jumpT=0; C.jumpFront=C.front; C.jumpVz=Math.max(C.vz,3); }

/* ================= game state ================= */
let state='boot', time=0, stateT=0;
const G={mode:'campaign',level:0,cp:null,shake:0,endlessBest:store.get('endlessBest',0),progress:store.get('progress',{unlocked:1,stars:[0,0,0]}),section:'',peakHP:0,startTime:0,hintShown:{}};
const input={l:false,r:false,up:false,down:false,sprint:false,drag:0,padSteer:0,padSpeed:0};

function blocker(){
  let best=null, bz=Infinity;
  for(const w of T.walls){ if(w.alive && w.z>C.z-2 && w.z-.7<bz){ bz=w.z-.7; best=w; } }
  if(T.fort && !T.fort.breached && T.fort.z-1.3<bz && T.fort.z>C.z-2){ bz=T.fort.z-1.3; best=T.fort.door; }
  if(T.boss && T.boss.alive && T.boss.z-3.4<bz){ bz=T.boss.z-3.4; best=T.boss; }
  return best?{o:best,bz}:null;
}
function meleeDPS(){ return C.n[0]*CFG.melee[0]+C.n[1]*CFG.melee[1]+C.n[2]*CFG.melee[2]; }
function takeDebt(rate,dt){ C.hpDebt+=rate*dt; if(C.hpDebt>=1){ const k=Math.floor(C.hpDebt); C.hpDebt-=k; removeHP(k); } }

function step(dt){
  const moving=state==='play';
  // ---- speed + steering
  let base=CFG.baseSpeed; if(G.mode==='endless') base=Math.min(CFG.baseSpeed+C.z/260,17);
  let tgt=base; if(input.up||input.sprint||input.padSpeed>.3) tgt=base+5; if(input.down||input.padSpeed<-.3) tgt=Math.max(CFG.minSpeed,base-3.5);
  C.speed=lerp(C.speed,tgt,1-Math.exp(-dt*4));
  let steer=(input.r?1:0)-(input.l?1:0)+input.padSteer;
  C.steerVis=lerp(C.steerVis,clamp(steer,-1,1)+clamp(input.drag*.05,-1,1),1-Math.exp(-dt*8));
  if(moving){ C.x-=steer*CFG.steer*dt; C.x-=input.drag; }
  input.drag=0;
  // ---- forward movement with blockers
  const blk=moving?blocker():null; let vz=moving?C.speed:0;
  C.engaged=null;
  if(blk){ const lim=blk.bz-C.front-.1; if(C.z+vz*dt>lim) vz=Math.max(0,(lim-C.z)/dt); if(C.z+C.front>=blk.bz-.45) C.engaged=blk.o; }
  if(state==='won') vz=0;
  C.vz=vz; C.prevZ=C.z; C.z+=vz*dt;
  // ---- jump clock
  if(C.jumpT!==null){ C.jumpT+=dt; if(C.jumpT>C.air+(C.jumpFront-C.back)/C.jumpVz+.05) C.jumpT=null; }
  // ---- formation + lane fitting
  const R=computeSlots(); C.radius=R;
  const seg=segAt(C.z); let railed=false, lx0=0, lx1=0;
  if(seg&&!seg.gone){ for(const l of seg.lanes){ laneAt(l,seg,C.z); if(l.rail&&C.x>=LR[0]-.8&&C.x<=LR[1]+.8){ railed=true; lx0=LR[0]; lx1=LR[1]; break; } } }
  // bridges without rails still squeeze the crowd to their width, but they do not hold the crowd in: steer off-centre and the edge falls
  let bridge=false;
  if(!railed&&seg&&!seg.gone){ for(const l of seg.lanes){ laneAt(l,seg,C.z); if(C.x>=LR[0]-.3&&C.x<=LR[1]+.3){ bridge=true; lx0=LR[0]; lx1=LR[1]; break; } } }
  let fx=1,fz=1,shift=0,back=0,Hh=Infinity;
  if(railed||bridge){ Hh=Math.max(.6,(lx1-lx0)/2-(railed?.35:.2)); if(R>Hh){ fx=Hh/R; fz=Math.min(R/Hh,2.6); back=(fz-1)*R*.6; } }
  if(railed){ C.x=clamp(C.x,lx0+.3,lx1-.3); const hw=Math.min(R,Hh); shift=(lx1-lx0<2*hw+.5)?(lx0+lx1)/2-C.x:clamp(C.x,lx0+hw+.2,lx1-hw-.2)-C.x; }
  else { const lim=(T.fort||T.boss)&&C.z>(T.fort?T.fort.z-60:1e9)?CFG.arenaHalf+.5:H+1.2; C.x=clamp(C.x,-lim,lim); }
  C.compress=(railed||bridge)?R/Hh:1;
  const k=1-Math.exp(-dt*9); let front=-99, bk=99, maxY=0;
  for(let t=0;t<3;t++){ const arr=C.units[t];
    for(let i=0;i<arr.length;i++){ const u=arr[i]; const tx=u.sx*fx+shift, tz=u.sz*fz-back;
      u.ox+=(tx-u.ox)*k; u.oz+=(tz-u.oz)*k; if(u.oz>front) front=u.oz; if(u.oz<bk) bk=u.oz; } }
  C.front=front>-99?front:0; C.back=bk<99?bk:0;
  // ---- per-unit height, rail clamp, support
  for(let t=0;t<3;t++){ const arr=C.units[t];
    for(let i=0;i<arr.length;i++){ const u=arr[i]; u.y=unitY(u); if(u.y>maxY) maxY=u.y;
      let wx=C.x+u.ox; const wz=C.z+u.oz; let sup=false; const s=segAt(wz);
      if(s&&!s.gone){ for(const l of s.lanes){ laneAt(l,s,wz);
          if(l.rail&&wx>LR[0]-.8&&wx<LR[1]+.8){ const cx=clamp(wx,LR[0]+.15,LR[1]-.15); if(cx!==wx){ wx=cx; u.ox=wx-C.x; } sup=true; break; }
          if(wx>=LR[0]&&wx<=LR[1]){ sup=true; if(s.crumble&&!s.fallAt&&u.y<.05&&moving) s.fallAt=time+CFG.crumbleDelay; break; } } }
      u.wx=wx; u.wz=wz;
      if(u.y>.05||!moving) sup=true;
      if(!sup){ u.off+=dt; if(u.off>CFG.grace) queueKill(t,i,'fall'); } else u.off=0; } }
  C.maxY=maxY;
  if(!moving){ processKills(); sync('hit'); return; }

  // ---- gates, checkpoints, sections
  for(const g of T.gates){ if(!g.used&&C.prevZ<g.z&&C.z>=g.z){ const row=T.gates.filter(o=>Math.abs(o.z-g.z)<.01);
      const hit=row.find(o=>C.x>=o.x0-.05&&C.x<=o.x1+.05); for(const o of row){ o.used=true; o.anim=hit===o?1:-1; } if(hit) applyGate(hit); } }
  for(const c of T.cps){ if(!c.passed&&C.z>=c.z){ c.passed=true; const n=C.n.slice(); const hp=n[0]+n[1]*5+n[2]*25; if(hp<12) n[0]+=12-hp; G.cp={z:c.z,n}; popup('Checkpoint saved','#16a99b',0); burst(C.x,2,C.z+C.front,0x16a99b,12,6); } }
  for(const s of T.sections){ if(!s.shown&&C.z>=s.z){ s.shown=true; G.section=s.name; banner(s.name, sectionHint(s.name)); } }
  // ---- hazards
  hazards(dt);
  // ---- combat
  combat(dt);
  // ---- merging in funnels
  const cs=segAt(C.z);
  // each funnel promotes one tier step: the lowest tier that had 5+ units on entry
  if(cs&&cs.funnel){ if(C.funnelSeg!==cs.fid){ C.funnelSeg=cs.fid; C.funnelTier=C.n[0]>=CFG.mergeN?0:C.n[1]>=CFG.mergeN?1:-1; } }
  if(cs&&cs.funnel&&C.compress>1.12&&C.funnelTier>=0){ C.mergeT-=dt; if(C.mergeT<=0){ C.mergeT=.1; let merged=0; const ft=C.funnelTier;
      const batches=Math.max(1,Math.floor(C.n[ft]/30));
      for(let b=0;b<batches;b++){ if(C.n[ft]>=CFG.mergeN){ C.n[ft]-=CFG.mergeN; C.n[ft+1]++; merged++; } }
      if(merged){ processKills(); sync('merge'); if(time-C.mergePop>.8){ C.mergePop=time; popup('Merge','#f2b929',1); } } } }
  processKills(); sync('hit');
  if(hpPool()>G.peakHP) G.peakHP=hpPool();
  // ---- endless stream
  if(G.mode==='endless') endlessStream();
  // ---- end conditions
  if(total()===0){ state='dying'; stateT=0; }
}

function applyGate(g){
  const hp0=hpPool(); C.spawnOX=0; C.spawnOZ=C.front*.7;
  if(g.op==='+') C.n[0]+=g.val;
  else if(g.op==='-') removeHP(g.val);
  else if(g.op==='x') for(let t=0;t<3;t++) C.n[t]=Math.round(C.n[t]*g.val);
  else if(g.op==='/') removeHP(hp0-Math.ceil(hp0/g.val));
  capUnits(); sync(g.good?'none':'hit'); C.spawnOX=0; C.spawnOZ=0;
  popup(OPS[g.op]+g.val, g.good?'#ffffff':'#ffd0cc', 1);
  if(!G.hintShown.gate&&G.mode==='campaign'){ G.hintShown.gate=1; }
}

function hazards(dt){
  const us=C.units;
  for(const s of T.saws){ if(Math.abs(s.z-C.z)>C.radius*3.6+4) continue; s.cd-=dt; if(s.cd>0) continue; s.cd=.05; const rr=(s.r+.25)*(s.r+.25);
    for(let t=0;t<3;t++) for(let i=0;i<us[t].length;i++){ const u=us[t][i]; if(u.y>.9) continue; const dx=u.wx-s.x, dz=u.wz-s.z; if(dx*dx+dz*dz<rr) queueKill(t,i,'hit'); } }
  for(const p of T.pends){ if(Math.abs(p.z-C.z)>C.radius*3.6+4) continue; if(p.by>3) continue; const rr=(p.r+.3)*(p.r+.3);
    for(let t=0;t<3;t++) for(let i=0;i<us[t].length;i++){ const u=us[t][i]; if(p.by-p.r>u.y+1.1) continue; const dx=u.wx-p.bx, dz=u.wz-p.z; if(dx*dx+dz*dz<rr) queueKill(t,i,'hit'); } }
  for(const b of T.barrels){ if(!b.alive||Math.abs(b.z-C.z)>C.radius*3.6+3) continue; let touched=false;
    for(let t=0;t<3&&!touched;t++) for(const u of us[t]){ const dx=u.wx-b.x, dz=u.wz-b.z; if(dx*dx+dz*dz<1.1){ touched=true; break; } }
    if(touched) explode(b); }
  if(C.engaged&&C.engaged.kind==='wall') takeDebt(CFG.wallBite,dt);
}
function explode(b){ if(!b.alive) return; b.alive=false; b.g.visible=false; burst(b.x,1,b.z,0xff8a3c,26,11,.9); burst(b.x,1,b.z,0x333333,10,6,1.1); G.shake=Math.max(G.shake,.45);
  const r2=2.4*2.4; for(let t=0;t<3;t++) for(let i=0;i<C.units[t].length;i++){ const u=C.units[t][i]; const dx=u.wx-b.x, dz=u.wz-b.z; if(dx*dx+dz*dz<r2) queueKill(t,i,'hit'); }
  for(const w of T.walls) if(w.alive&&Math.abs(w.z-b.z)<5) damage(w,60);
  for(const o of T.barrels) if(o.alive&&o!==b&&Math.hypot(o.x-b.x,o.z-b.z)<3.4) setTimeout(()=>explode(o),120);
}

/* ---------- combat ---------- */
function targets(){
  const list=[]; const zmin=C.z+C.front*.3, zmax=C.z+CFG.range;
  const add=(o,prio)=>{ if(o&&o.alive&&o.z>zmin&&o.z<zmax) list.push([o,prio]); };
  for(const b of T.barrels) add(b,2); for(const w of T.walls) add(w,0);
  if(T.fort&&!T.fort.breached){ for(const a of T.fort.archers) add(a,1.4); add(T.fort.door,0); }
  if(T.boss&&T.boss.alive){ for(const w of T.boss.weak) add(w,1.2); add(T.boss,0); }
  return list;
}
function pickTarget(){ let best=null,bd=Infinity; for(const [o,p] of targets()){ const d=(o.z-C.z)-p*12+Math.abs(o.x-C.x)*.3; if(d<bd){ bd=d; best=o; } } return best; }
function combat(dt){
  C.volleyT-=dt;
  if(C.volleyT<=0&&(C.n[1]+C.n[2])>0){ C.volleyT=CFG.volley; const tgt=pickTarget();
    if(tgt){ const u1=C.units[1], u2=C.units[2];
      const shots1=u1.length?Math.min(6,1+Math.floor(u1.length/8)):0, shots2=u2.length?Math.min(4,1+Math.floor(u2.length/5)):0;
      const d1=C.n[1]*CFG.ranged[1]*CFG.volley, d2=C.n[2]*CFG.ranged[2]*CFG.volley;
      for(let s=0;s<shots1;s++){ const u=u1[(rand()*u1.length)|0]; fire(u.wx,u.y+.8,u.wz,tgt,d1/shots1,false); }
      for(let s=0;s<shots2;s++){ const u=u2[(rand()*u2.length)|0]; fire(u.wx,u.y+1.2,u.wz,tgt,d2/shots2,true); } } }
  // melee on whatever is blocking the crowd
  if(C.engaged){ const d=meleeDPS()*dt; damage(C.engaged,d); if(rand()<dt*14) burst(C.x+(rand()-.5)*Math.min(C.radius*2,10),1+rand()*1.5,C.z+C.front+.3,0xffffff,2,4,.35); }
  // fortress archers
  const F=T.fort;
  if(F&&!F.breached&&F.z-C.z<52){ for(const a of F.archers){ if(!a.alive) continue; a.cd-=dt; if(a.cd<=0){ a.cd=1.3+rand()*1.3; enemyShot(a.x,a.y,a.z); } } }
  // boss
  const B=T.boss; if(B&&B.alive&&B.z-C.z<62) bossAI(B,dt);
  if(B&&B.alive&&C.engaged===B) takeDebt(2+B.lv*2.5,dt);
  updateShots(dt); updateArrows(dt);
}
function fire(x,y,z,tgt,dmg,splash){ if(shots.length>=PJN) return; shots.push({x,y,z,tgt,tx:tgt.x,ty:tgt.y,tz:tgt.z,dmg,splash,life:2}); }
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){ const s=shots[i]; if(s.tgt.alive){ s.tx=s.tgt.x; s.ty=s.tgt.y; s.tz=s.tgt.z; }
    const dx=s.tx-s.x, dy=s.ty-s.y, dz=s.tz-s.z, d=Math.hypot(dx,dy,dz), v=52*dt; s.life-=dt;
    if(d<=v+.3||s.life<=0){ if(s.tgt.alive&&s.life>0){ damage(s.tgt,s.dmg); if(s.splash){ burst(s.tx,s.ty,s.tz,0xffd23f,5,6,.5); for(const [o] of targets()){ if(o!==s.tgt&&Math.hypot(o.x-s.tx,o.z-s.tz)<CFG.splash) damage(o,s.dmg*.5); } } else if(rand()<.3) burst(s.tx,s.ty,s.tz,0x9ff5ea,2,3,.3); }
      shots.splice(i,1); continue; }
    s.x+=dx/d*v; s.y+=dy/d*v; s.z+=dz/d*v; }
  let k=0; for(const s of shots){ tmpM.makeScale(s.splash?1.6:1,s.splash?1.6:1,s.splash?1.6:1); tmpM.setPosition(s.x,s.y,s.z); pjMesh.setMatrixAt(k,tmpM); pjMesh.setColorAt(k,tmpC.setHex(s.splash?0xffd23f:0x7ff2e2)); k++; }
  for(let i=k;i<PJN;i++){ tmpM.makeScale(0,0,0); pjMesh.setMatrixAt(i,tmpM); } pjMesh.instanceMatrix.needsUpdate=true; if(pjMesh.instanceColor) pjMesh.instanceColor.needsUpdate=true;
}
function enemyShot(x,y,z){ if(arrows.length>=ENN) return; const all=C.units[0].length?C.units[0]:C.units[1].length?C.units[1]:C.units[2]; if(!all.length) return;
  const u=all[(rand()*all.length)|0]; const dur=1.0+rand()*.3; arrows.push({sx:x,sy:y,sz:z,tx:u.wx+(rand()-.5)*.8,tz:u.wz+C.vz*dur+(rand()-.5)*.8,t:0,dur,x,y,z}); }
function updateArrows(dt){
  for(let i=arrows.length-1;i>=0;i--){ const a=arrows[i]; a.t+=dt; const p=Math.min(1,a.t/a.dur);
    a.x=lerp(a.sx,a.tx,p); a.z=lerp(a.sz,a.tz,p); a.y=lerp(a.sy,.3,p)+Math.sin(p*Math.PI)*4;
    if(p>=1){ burst(a.x,.4,a.z,0xff5a3c,5,4,.4); const r2=1.1*1.1;
      for(let t=0;t<3;t++) for(let j=0;j<C.units[t].length;j++){ const u=C.units[t][j]; if(u.y>1) continue; const dx=u.wx-a.x, dz=u.wz-a.z; if(dx*dx+dz*dz<r2) queueKill(t,j,'hit'); }
      arrows.splice(i,1); } }
  let k=0; for(const a of arrows){ tmpM.makeTranslation(a.x,a.y,a.z); enMesh.setMatrixAt(k++,tmpM); }
  for(let i=k;i<ENN;i++){ tmpM.makeScale(0,0,0); enMesh.setMatrixAt(i,tmpM); } enMesh.instanceMatrix.needsUpdate=true;
}
function damage(o,d){
  if(!o||!o.alive||d<=0) return;
  switch(o.kind){
    case 'barrel': o.hp-=d; if(o.hp<=0) explode(o); break;
    case 'wall': o.hp-=d; o.flash=.12; if(o.hp<=0){ o.alive=false; o.g.visible=false; burst(o.x,1.5,o.z,0x8a7866,40,12,1); burst(o.x,1.5,o.z,0x5d646f,14,8,1); G.shake=.4; popup('Wall down','#fff',1); } break;
    case 'archer': o.hp-=d; if(o.hp<=0){ o.alive=false; o.fall=.01; burst(o.x,o.y,o.z,COL.enemy,10,6); } break;
    case 'door': o.hp-=d; if(o.hp<=0){ o.alive=false; breach(); } break;
    case 'weak': { const B=T.boss; o.hp-=d*2; B.hp-=d*.6; B.flash=.1; if(o.hp<=0){ o.alive=false; o.m.visible=false; B.hp-=B.max*.12; B.cd+=1.6; burst(o.x,o.y,o.z,0xffd23f,30,10,1); G.shake=.5; popup('Weak point broken','#ffd23f',1); } break; }
    case 'boss': o.hp-=d; o.flash=.08; break;
  }
  if(T.boss&&T.boss.alive&&T.boss.hp<=0) bossDie();
}
function breach(){ const F=T.fort; F.breached=true; F.sink=.001; for(const a of F.archers){ if(a.alive){ a.alive=false; a.fall=.01; } }
  burst(0,2,F.z,0x6b4a2e,50,14,1.2); burst(0,3,F.z,0x9d8f80,40,12,1.2); G.shake=.8; banner('Gate breached','Now take down the Warden'); }

/* ---------- boss ---------- */
function bossAI(B,dt){
  B.cd-=dt;
  for(const w of B.weak){ w.x=B.g.position.x+w.ox; w.y=w.oy+B.body.position.y; w.z=B.z+w.oz; }
  if(!B.atk&&B.cd<=0){ const kind=(B.lastAtk==='slam'&&rand()<.7)||rand()<.35?'wave':'slam'; B.lastAtk=kind;
    if(kind==='slam'){ const r=3+B.lv*.3; const ring=new THREE.Mesh(new THREE.RingGeometry(r-.35,r,40),basic(0xe0483f,{transparent:true,opacity:.2,side:THREE.DoubleSide,depthWrite:false}));
      ring.material.userData.own=true; ring.rotation.x=-Math.PI/2; const fill=new THREE.Mesh(new THREE.CircleGeometry(r,40),basic(0xe0483f,{transparent:true,opacity:.12,depthWrite:false})); fill.material.userData.own=true; fill.rotation.x=-Math.PI/2;
      const tx=clamp(C.x+(rand()-.5)*3,-10,10), tz=Math.min(C.z+C.front*.3+(rand()-.3)*2,B.z-5);
      ring.position.set(tx,.06,tz); fill.position.set(tx,.05,tz); T.group.add(ring); T.group.add(fill);
      B.atk={kind,t:0,x:tx,z:tz,r,ring,fill,dur:1.25-B.lv*.08}; }
    else { const ring=new THREE.Mesh(new THREE.RingGeometry(.1,1,64),basic(0xffd23f,{transparent:true,opacity:.85,side:THREE.DoubleSide,depthWrite:false})); ring.material.userData.own=true; ring.rotation.x=-Math.PI/2; ring.visible=false; ring.position.set(0,.08,B.z); T.group.add(ring);
      B.atk={kind,t:0,R:0,prevR:0,ring,wind:.85}; if(!G.hintShown.wave){ G.hintShown.wave=1; hint(IS_TOUCH?'Shockwave: tap Jump as the ring reaches your squad':'Shockwave: press Space as the ring reaches your squad'); } } }
  const A=B.atk; if(!A) return;
  A.t+=dt;
  if(A.kind==='slam'){ const p=A.t/A.dur; A.ring.material.opacity=.25+.6*p; A.fill.material.opacity=.1+.25*p; const s=.3+.7*Math.min(1,p*1.4); A.fill.scale.set(s,s,s);
    const arm=B.arms[A.x<0?1:0]; arm.rotation.x=-lerp(0,2.2,Math.min(1,p*1.3));
    if(A.t>=A.dur){ const r2=A.r*A.r; for(let t=0;t<3;t++) for(let i=0;i<C.units[t].length;i++){ const u=C.units[t][i]; const dx=u.wx-A.x, dz=u.wz-A.z; if(dx*dx+dz*dz<r2) queueKill(t,i,'hit'); }
      burst(A.x,.5,A.z,0x8a7866,30,12,1); G.shake=.7; arm.rotation.x=0; endAtk(B); } }
  else { if(A.t<A.wind){ B.body.position.y=-Math.sin(A.t/A.wind*Math.PI)*.8; return; } B.body.position.y=0; A.ring.visible=true;
    A.prevR=A.R; A.R+=(15+B.lv*1.5)*dt; const R=A.R; A.ring.scale.set(R,R,1); A.ring.geometry.dispose(); A.ring.geometry=new THREE.RingGeometry(Math.max(.01,1-.9/R),1,64);
    for(let t=0;t<3;t++) for(let i=0;i<C.units[t].length;i++){ const u=C.units[t][i]; if(u.y>.45) continue; const d=Math.hypot(u.wx-B.x,u.wz-B.z); if(d>A.prevR-.3&&d<=R+.3) queueKill(t,i,'hit'); }
    if(R>45) endAtk(B); }
}
function endAtk(B){ const A=B.atk; for(const m of [A.ring,A.fill]) if(m){ T.group.remove(m); m.geometry.dispose(); m.material.dispose(); } B.atk=null; B.cd=Math.max(1.4,3.4-B.lv*.45)+rand()*1.2; }
function bossDie(){ const B=T.boss; if(!B.alive) return; B.alive=false; B.dead=.001; if(B.atk) endAtk(B); for(let i=0;i<5;i++) burst((rand()-.5)*6,4+rand()*6,B.z,i%2?0xffd23f:0x5b4d66,30,14,1.4); G.shake=1.1; state='won'; stateT=0; banner('Keep taken','The Warden has fallen'); }

/* ---------- endless ---------- */
const POOL=[['run',3],['gates',6],['saws',3],['pend',2],['barrels',2],['wall',2],['funnel',2],['jump',2],['crumble',1.5],['branch',1.5]];
function endlessStream(){
  while(T.Z<C.z+230){ const d=C.z/700; let r=T.rnd()*POOL.reduce((a,p)=>a+p[1],0), kind='run'; for(const [k,w] of POOL){ r-=w; if(r<=0){ kind=k; break; } }
    if(kind===G.lastKind&&kind!=='gates') kind='gates'; G.lastKind=kind; const R=T.rnd;
    const good=()=>R()<.35?'x'+(R()<.7?2:3):'+'+(5+Math.floor(R()*(12+d*10))), bad=()=>R()<.3?'/2':'-'+(6+Math.floor(R()*(12+d*25)));
    switch(kind){
      case 'run': P.run(10+R()*10); break;
      case 'gates': R()<.5?P.gates(good(),bad()):P.gates(bad(),good()); if(R()<.3) P.gates(good(),good()); break;
      case 'saws': P.saws(1+Math.min(3,Math.floor(R()*(1+d))),1+d*.25); break;
      case 'pend': P.pend(1+Math.min(2,Math.floor(R()*(1+d))),1.4+d*.2); break;
      case 'barrels': P.barrels(3+Math.floor(R()*3)); break;
      case 'wall': P.wall(Math.round(60+hpPool()*.35+d*80)); break;
      case 'funnel': P.funnel(2.6+R()*1.2); break;
      case 'jump': P.jump(3.5+Math.min(2,d*.6)+R()); break;
      case 'crumble': P.crumble(16+R()*14,Math.max(4,6.5-d*.6)); break;
      case 'branch': P.branch(['x'+(2+Math.floor(R()*2))],['+'+(10+Math.floor(R()*15))],50+R()*20,d>1.2&&R()<.5); break; } }
  const cut=C.z-45; let removed=false;
  while(T.chunks.length&&T.chunks[0].z1<cut){ const ch=T.chunks.shift(); T.group.remove(ch.g); disposeTree(ch.g); removed=true; }
  if(removed){ const keep=o=>o.z>cut; T.segs=T.segs.filter(s=>s.z1>=cut); T.gates=T.gates.filter(keep); T.saws=T.saws.filter(keep); T.pends=T.pends.filter(keep); T.barrels=T.barrels.filter(keep); T.walls=T.walls.filter(keep); T.crumbles=T.crumbles.filter(s=>s.z1>=cut); }
}

/* ================= visuals ================= */
function animateWorld(dt){
  for(const s of T.saws){ s.x=s.cx+Math.sin(time*s.spd+s.ph)*s.amp; s.g.position.x=s.x; s.d.rotation.y+=dt*14; }
  for(const p of T.pends){ const a=Math.sin(time*p.spd+p.ph)*p.amp; p.piv.rotation.z=a; p.bx=p.cx+Math.sin(a)*p.len; p.by=p.top-Math.cos(a)*p.len; }
  for(const s of T.crumbles){ if(s.fallAt&&!s.gone&&time>=s.fallAt){ s.gone=true; burst(0,-.2,(s.z0+s.z1)/2,0xb08f63,6,4,.6); }
    if(s.gone&&s.meshes.length){ s.fallV+=30*dt; for(const m of s.meshes){ m.position.y-=s.fallV*dt; m.rotation.x+=dt*.6; } if(s.meshes[0].position.y<-40){ for(const m of s.meshes) m.visible=false; s.meshes=[]; } }
    else if(s.fallAt&&!s.gone){ const w=Math.sin(time*60)*.04; for(const m of s.meshes) m.position.x=w; } }
  for(const g of T.gates){ if(g.anim>0){ g.anim=Math.max(0,g.anim-dt*2); g.pm.opacity=.42*g.anim; g.lab.scale.setScalar(1+(1-g.anim)*.6); g.lab.material.opacity=g.anim; if(g.anim===0) g.g.visible=false; }
    else if(g.anim<0){ g.anim=Math.min(0,g.anim+dt*2); g.pm.opacity=.14; g.lab.material.opacity=.35; } }
  for(const w of T.walls){ if(w.flash>0){ w.flash-=dt; w.g.position.x=(rand()-.5)*.12; } else w.g.position.x=0; }
  const F=T.fort; if(F){ for(const a of F.archers){ if(a.fall>0&&a.m.visible){ a.fall+=dt; a.m.rotation.x-=dt*3; a.m.position.y-=dt*a.fall*14; a.m.position.z+=dt*2; if(a.m.position.y<-4) a.m.visible=false; } else if(a.alive){ a.m.position.y=5.2+Math.abs(Math.sin(time*3+a.x))*.1; } }
    if(F.sink>0&&F.wg.position.y>-8){ F.sink+=dt; F.wg.position.y-=dt*F.sink*3; F.wg.position.x=(rand()-.5)*.15; } }
  const B=T.boss; if(B){ if(B.alive){ B.head.rotation.y=Math.sin(time*.8)*.15; B.g.position.x=Math.sin(time*.5)*.6; if(!B.atk){ B.arms[0].rotation.x=Math.sin(time*1.6)*.12; B.arms[1].rotation.x=-Math.sin(time*1.6)*.12; }
      B.x=B.g.position.x; if(B.flash>0){ B.flash-=dt; B.body.position.x=(rand()-.5)*.2; } else B.body.position.x=0;
      for(const w of B.weak){ if(w.alive){ const s=.7+Math.sin(time*6+w.ox)*.08; w.m.scale.setScalar(s); } } }
    else if(B.dead>0&&B.g.position.y>-20){ B.dead+=dt; B.g.position.y-=dt*B.dead*2.4; B.g.rotation.x-=dt*.35; } }
}
function renderCrowd(dt){
  const run=C.vz>.5, cheer=state==='won';
  for(let t=0;t<3;t++){ const m=UM[t], arr=C.units[t]; let k=0; const lean=-C.steerVis*.25;
    for(const u of arr){ let y=u.y; if(run&&y===0) y+=Math.abs(Math.sin(time*13+u.ph))*.13; if(cheer) y+=Math.max(0,Math.sin(time*9+u.ph))*.6;
      tmpE.set(run?.08:0,u.yaw,lean); tmpQ.setFromEuler(tmpE); tmpV.set(C.x+u.ox,y,C.z+u.oz); tmpS.set(1,1,1); tmpM.compose(tmpV,tmpQ,tmpS); m.setMatrixAt(k++,tmpM); }
    const fl=C.fallers[t];
    for(let i=fl.length-1;i>=0;i--){ const f=fl[i]; f.life-=dt; f.vy-=26*dt; f.y+=f.vy*dt; f.r+=dt*4; if(f.life<=0){ fl.splice(i,1); continue; } }
    for(const f of fl){ if(k>=m.instanceMatrix.count) break; tmpE.set(f.r,0,f.r*.4); tmpQ.setFromEuler(tmpE); tmpV.set(f.x,f.y,f.z); tmpS.set(1,1,1); tmpM.compose(tmpV,tmpQ,tmpS); m.setMatrixAt(k++,tmpM); }
    m.count=k; m.instanceMatrix.needsUpdate=true; }
}
const camPos=new THREE.Vector3(0,14,-16), camLook=new THREE.Vector3();
function updateCamera(dt){
  let px,py,pz,lx,ly,lz;
  if(state==='menu'||state==='boot'){ const a=time*.15; px=C.x+Math.sin(a)*16; pz=C.z+Math.cos(a)*16-2; py=9; lx=C.x; ly=1; lz=C.z+3; }
  else { const R=Math.min(C.radius,14); const arena=(T.fort&&C.z>T.fort.z-70)||(T.boss&&C.z>T.boss.z-80); const bossNear=T.boss&&C.z>T.boss.z-60;
    const back=12+R*1.15+(arena?5:0), up=9+R*.85+(arena?4:0)+(bossNear?3:0);
    px=C.x*.55; py=up; pz=C.z+C.back*.2-back; lx=C.x*.35; ly=bossNear?3.5:.5; lz=C.z+11+(arena?6:0); }
  const k=1-Math.exp(-dt*(state==='menu'?2:5)); camPos.x=lerp(camPos.x,px,k); camPos.y=lerp(camPos.y,py,k); camPos.z=lerp(camPos.z,pz,k);
  camLook.x=lerp(camLook.x,lx,k); camLook.y=lerp(camLook.y,ly,k); camLook.z=lerp(camLook.z,lz,k);
  camera.position.copy(camPos); if(G.shake>0){ const s=G.shake*.6; camera.position.x+=(rand()-.5)*s; camera.position.y+=(rand()-.5)*s; G.shake=Math.max(0,G.shake-dt*1.8); }
  camera.lookAt(camLook); voidMesh.position.z=C.z; voidMesh.position.x=C.x; sun.position.set(C.x-20,40,C.z-12); sun.target.position.set(C.x,0,C.z); sun.target.updateMatrixWorld();
}

const fmt=n=>n>=10000?(n/1000).toFixed(1)+'k':String(n);

function clearBanners(){ bannerTimer=0; hintTimer=0; bannerEl.classList.remove('show'); hintEl.classList.remove('show'); for(const p of pops){ p.life=0; p.el.style.opacity=0; } }

  if(name==='Crowd build') return kb?'Steer with A / D into the blue gates':'Drag to steer into the blue gates';
  if(name==='Hazard course'||name==='The sawmill'||name==='Gauntlet') return kb?'Space jumps gaps. Funnels merge 5 units into 1 stronger one':'Tap Jump for gaps. Funnels merge 5 units into 1';
  if(name==='Branching paths') return 'Left lane: big multipliers, no rails. Right lane: safe';

const pops=[]; for(let i=0;i<10;i++){ const d=document.createElement('div'); d.className='pop'; d.style.opacity=0; popsEl.append(d); pops.push({el:d,life:0,x:0,y:0,z:0}); } let popHead=0;

function updateHud(dt){
  if(bannerTimer>0){ bannerTimer-=dt; if(bannerTimer<=0) bannerEl.classList.remove('show'); }

  for(const p of pops){ if(p.life<=0) continue; p.life-=dt; p.y+=dt*1.6; const [sx,sy,ok]=project(p.x,p.y,p.z); p.el.style.opacity=ok?clamp(p.life/.5,0,1):0; p.el.style.transform=`translate(${sx}px,${sy}px) translate(-50%,-50%)`; }
  if(state==='menu'||state==='boot'){ badge.style.opacity=0; return; }
  const tt=total(); setText('n0',fmt(C.n[0])); setText('n1',fmt(C.n[1])); setText('n2',fmt(C.n[2])); setText('hp',fmt(hpPool()));
  badge.textContent=fmt(tt); badge.classList.toggle('low',tt<10);
  const [bx,by,ok]=project(C.x,C.maxY+2.2+Math.min(C.radius,8)*.12,C.z+Math.max(0,C.front*.35)); badge.style.opacity=ok&&tt>0?1:0; badge.style.transform=`translate(${bx}px,${by}px) translate(-50%,-100%)`;

  else { $('#progFill').style.width='0%'; setText('section',Math.floor(C.z)+' m   best '+G.endlessBest+' m'); }

  const tEl=$('#target'); if(tg&&tg.max){ tEl.hidden=false; setText('targetName',tg.name||''); $('#targetFill').style.width=clamp(tg.hp/tg.max*100,0,100)+'%'; } else tEl.hidden=true;
}

/* ---------- leaderboard (shared when the page is published with db, else this device only) ---------- */
const LB={db:null,user:null};

async function submitScore(best){ if(!LB.db||!LB.user||best<=0) return false;

    if(best>prev) await ref.set({best,at:Date.now()}); return true; }catch(e){ return false; } }

      const prof=ids.length?await LB.user.profiles(ids):{};

/* ================= flow ================= */
function attract(){ resetTrack(LEVELS[0].seed); LEVELS[0].build(); resetCrowd([26,4,1],8); G.mode='campaign'; }
function startLevel(i,fromCp){ clearBanners();
  G.mode='campaign'; G.level=i; resetTrack(LEVELS[i].seed); LEVELS[i].build(); shots.length=0; arrows.length=0;
  if(fromCp&&G.cp){ resetCrowd(G.cp.n,G.cp.z); for(const g of T.gates) if(g.z<G.cp.z){ g.used=true; g.g.visible=false; } for(const c of T.cps) if(c.z<=G.cp.z) c.passed=true; for(const s of T.sections) if(s.z<G.cp.z){ s.shown=true; G.section=s.name; } for(const b of T.barrels) if(b.z<G.cp.z){ b.alive=false; b.g.visible=false; } for(const w of T.walls) if(w.z<G.cp.z){ w.alive=false; w.g.visible=false; } }
  else { G.cp=null; G.section=''; resetCrowd(LEVELS[i].start,5); G.startTime=time; G.peakHP=0; }
  setText('lvlName',(i+1)+'. '+LEVELS[i].name); buildMarks(); begin();
}
function startEndless(){ clearBanners(); G.mode='endless'; G.cp=null; G.lastKind=''; resetTrack((Math.random()*1e9)|0); P.run(30); P.gates('+10','x2'); resetCrowd([16,0,0],5); shots.length=0; arrows.length=0; G.section=''; G.startTime=time; G.peakHP=0;
  setText('lvlName','Endless run'); buildMarks(); begin(); }
function begin(){ hide(); hud.hidden=false; $('#touch').hidden=!IS_TOUCH; state='play'; camPos.set(C.x,14,C.z-22); for(const k in hudCache) delete hudCache[k]; if(G.mode==='endless') hint(IS_TOUCH?'Drag to steer, tap Jump over gaps':'A / D steer, Space jumps, W sprints'); }
screen.addEventListener('click',e=>{ const b=e.target.closest('button[data-act]'); if(!b||b.disabled) return; const a=b.dataset.act;
  if(a==='level') startLevel(+b.dataset.i); else if(a==='endless') startEndless(); else if(a==='help') helpScreen(); else if(a==='board') boardScreen();
  else if(a==='menu') menuScreen(); else if(a==='resume'){ hide(); state='play'; } else if(a==='restart'){ G.mode==='endless'?startEndless():startLevel(G.level); }
  else if(a==='checkpoint') startLevel(G.level,true); else if(a==='next') startLevel(G.level+1); });

/* ================= input ================= */
const KEYS={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down'};
addEventListener('keydown',e=>{ if(KEYS[e.code]){ input[KEYS[e.code]]=true; e.preventDefault(); }
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) tryJump(); }
  if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){ if(state==='play') pauseScreen(); else if(state==='pause'){ hide(); state='play'; } } });
addEventListener('keyup',e=>{ if(KEYS[e.code]) input[KEYS[e.code]]=false; });
addEventListener('blur',()=>{ for(const k of ['l','r','up','down','sprint']) input[k]=false; if(state==='play') pauseScreen(); });
let drag=null;
canvas.addEventListener('pointerdown',e=>{ if(state!=='play') return; drag={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),jumped:false}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; const dx=e.clientX-drag.x; drag.x=e.clientX; input.drag+=dx*(16/Math.min(innerWidth,900));
  if(!drag.jumped&&drag.y-e.clientY>60&&performance.now()-drag.t<300){ drag.jumped=true; tryJump(); } });
const endDrag=e=>{ if(drag&&e.pointerId===drag.id) drag=null; }; canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
$('#jumpBtn').addEventListener('pointerdown',e=>{ e.preventDefault(); tryJump(); });
const sb=$('#sprintBtn'); sb.addEventListener('pointerdown',e=>{ e.preventDefault(); input.sprint=true; sb.classList.add('on'); });
for(const ev of ['pointerup','pointercancel','pointerleave']) sb.addEventListener(ev,()=>{ input.sprint=false; sb.classList.remove('on'); });
$('#pauseBtn').addEventListener('click',()=>{ if(state==='play') pauseScreen(); });
let padJump=false, padStart=false;
function pollPad(){ const pads=navigator.getGamepads?navigator.getGamepads():[]; let p=null; for(const g of pads) if(g){ p=g; break; } if(!p){ input.padSteer=0; input.padSpeed=0; return; }
  const ax=p.axes[0]||0, ay=p.axes[1]||0; input.padSteer=Math.abs(ax)>.2?ax:0; input.padSpeed=Math.abs(ay)>.3?-ay:0;
  if(p.buttons[14]&&p.buttons[14].pressed) input.padSteer=-1; if(p.buttons[15]&&p.buttons[15].pressed) input.padSteer=1;
  const j=p.buttons[0]&&p.buttons[0].pressed; if(j&&!padJump) tryJump(); padJump=j;
  const s=p.buttons[9]&&p.buttons[9].pressed; if(s&&!padStart){ if(state==='play') pauseScreen(); else if(state==='pause'){ hide(); state='play'; } } padStart=s; }

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000); last=now;
  pollPad();
  if(state==='pause'){ renderer.render(scene,camera); return; }
  time+=dt;
  step(dt);
  if(state==='dying'){ stateT+=dt; if(stateT>1.1){ state='dead'; deadScreen(); } }
  if(state==='won'){ stateT+=dt; if(stateT>2.2){ state='done'; winScreen(); } }
  animateWorld(dt); renderCrowd(dt); updateFx(dt); if(state!=='play'){ updateShots(dt); updateArrows(dt); }
  updateCamera(dt); updateHud(dt);
  renderer.render(scene,camera);
}
// Console hooks for tuning: UCR.CFG holds every balance number; UCR.sim(seconds) fast-forwards the simulation without rendering.
function sim(sec,h=1/60){ for(let t=0;t<sec&&(state==='play');t+=h){ time+=h; step(h); animateWorld(h); } }
window.UCR={C,T,G,CFG,LEVELS,P,startLevel,startEndless,tryJump,input,sim,get state(){return state;}};

const fontReady=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('68px "Bowlby One"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontReady.catch(()=>{}).then(()=>{ menuScreen(); requestAnimationFrame(t=>{ last=t; frame(t); }); });
})();
</script>
</body>
